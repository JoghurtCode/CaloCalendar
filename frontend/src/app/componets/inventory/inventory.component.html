<div class="inventory-container">
  <h2>Inventar</h2>

  <div class="new-item-form">
    <h3>Neues Item</h3>
    <mat-form-field appearance="fill">
      <mat-label>Name</mat-label>
      <input matInput [(ngModel)]="newItem.name" name="name">
    </mat-form-field>
    <br>
    <mat-form-field appearance="fill">
      <mat-label>Gewicht</mat-label>
      <input matInput type="number" [(ngModel)]="newItem.weight" name="weight">
    </mat-form-field>
    <br>
    <mat-form-field appearance="fill">
      <mat-label>Kalorien</mat-label>
      <input matInput type="number" [(ngModel)]="newItem.calories" name="calories">
    </mat-form-field>
    <br>
    <button mat-raised-button color="primary" (click)="addItem()">Hinzufügen</button>
  </div>

  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
      <td mat-cell *matCellDef="let item"> {{item.name}} </td>
    </ng-container>

    <!-- Weight Column -->
    <ng-container matColumnDef="weight">
      <th mat-header-cell *matHeaderCellDef> Gewicht </th>
      <td mat-cell *matCellDef="let item"> {{item.weight}} </td>
    </ng-container>

    <!-- Calories Column -->
    <ng-container matColumnDef="calories">
      <th mat-header-cell *matHeaderCellDef> Kalorien </th>
      <td mat-cell *matCellDef="let item"> {{item.calories}} </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Aktionen </th>
      <td mat-cell *matCellDef="let item">
        <button mat-icon-button color="warn" (click)="deleteItem(item.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSize]="5" showFirstLastButtons></mat-paginator>
</div>

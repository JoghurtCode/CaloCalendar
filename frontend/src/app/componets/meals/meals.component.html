<div class="meals-container">
  <h2>Meals</h2>

  <div class="new-meal-form">
    <h3>Neues Gericht</h3>
    <mat-form-field appearance="fill">
      <mat-label>Name</mat-label>
      <input matInput [(ngModel)]="newMeal.name" name="name">
    </mat-form-field>
    <br>
    <mat-form-field appearance="fill">
      <mat-label>Zutaten</mat-label>
      <input matInput [(ngModel)]="newMeal.ingredients" name="ingredients">
    </mat-form-field>
    <br>
    <mat-form-field appearance="fill">
      <mat-label>Kalorien</mat-label>
      <input matInput type="number" [(ngModel)]="newMeal.calories" name="calories">
    </mat-form-field>
    <br>
    <button mat-raised-button color="primary" (click)="addMeal()">Hinzufügen</button>
  </div>

  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
      <td mat-cell *matCellDef="let meal"> {{meal.name}} </td>
    </ng-container>

    <!-- Ingredients Column -->
    <ng-container matColumnDef="ingredients">
      <th mat-header-cell *matHeaderCellDef> Zutaten </th>
      <td mat-cell *matCellDef="let meal"> {{meal.ingredients}} </td>
    </ng-container>

    <!-- Calories Column -->
    <ng-container matColumnDef="calories">
      <th mat-header-cell *matHeaderCellDef> Kalorien </th>
      <td mat-cell *matCellDef="let meal"> {{meal.calories}} </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Aktionen </th>
      <td mat-cell *matCellDef="let meal">
        <button mat-icon-button color="warn" (click)="deleteMeal(meal.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSize]="5" showFirstLastButtons></mat-paginator>
</div>

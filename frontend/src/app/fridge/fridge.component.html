<div class="fridge-container">
  <div class="fridge-door">
    <div class="handle"></div>
  </div>
  <div class="fridge-body">
    <div class="fridge-top"></div>
    <div class="fridge-inner">
      <div class="fridge-shelf">
        <div class="shelf-divider"></div>
        <div class="shelf-item"></div>
        <div class="shelf-item"></div>
        <div class="shelf-item"></div>
        <div class="shelf-item"></div>
      </div>
      <div class="fridge-shelf">
        <div class="shelf-divider"></div>
        <div class="shelf-item"></div>
        <div class="shelf-item"></div>
        <div class="shelf-item"></div>
        <div class="shelf-item"></div>
      </div>
      <div class="fridge-shelf">
        <div class="shelf-divider"></div>
        <div class="shelf-item"></div>
        <div class="shelf-item"></div>
        <div class="shelf-item"></div>
        <div class="shelf-item"></div>
      </div>
    </div>
    <h2>Kühlschrank</h2>
    <div class="content">
      <div class="ingredients">
        <h3>Zutaten</h3>
        <div *ngFor="let ingredient of currentRecipe.ingredients" class="ingredient-item">{{ingredient}}</div>
      </div>
      <div class="recipe-section">
        <button mat-raised-button color="primary" (click)="shuffleRecipe()">Rezept Shuffle</button>
        <div class="recipe-display">
          <h3>{{currentRecipe.name}}</h3>
          <p>{{currentRecipe.details}}</p>
        </div>
        <button mat-raised-button color="accent" (click)="addToFavorites()">Zu Favoriten hinzufügen</button>
      </div>
    </div>
  </div>
</div>
